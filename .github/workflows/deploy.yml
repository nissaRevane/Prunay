name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "setup pour le premier amorçage du serveur, deploy ensuite"
        type: choice
        options: [deploy, setup]
        default: deploy

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"

      - run: gem install kamal -v 2.5.3

      - name: Ouvrir l'accès SSH au serveur
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: kamal ${{ inputs.command || 'deploy' }}
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
