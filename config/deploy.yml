service: prunay
image: nissarevane/prunay

# L'IP du VPS, à reporter aussi sur l'accessoire db : les deux tournent sur la même machine.
servers:
  web:
    - REMPLACER_PAR_L_IP

proxy:
  ssl: true
  host: REMPLACER_PAR_LE_HOSTNAME_OVH
  app_port: 3000

# OVH n'ouvre pas root : l'utilisateur est dans le groupe docker, Kamal n'a pas besoin de sudo.
ssh:
  user: debian

registry:
  server: ghcr.io
  username: nissaRevane
  password:
    - KAMAL_REGISTRY_PASSWORD

# Le VPS OVH est x86 : un build sur un Mac ARM passe par l'émulation.
builder:
  arch: amd64

env:
  clear:
    APP_HOST: REMPLACER_PAR_LE_HOSTNAME_OVH
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL

accessories:
  db:
    image: postgres:16-alpine
    host: REMPLACER_PAR_L_IP
    env:
      clear:
        POSTGRES_USER: prunay
        POSTGRES_DB: prunay_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs --follow
