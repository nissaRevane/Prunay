  # Le vocabulaire du domaine, hors des vues : le modèle s'en sert pour nommer une
  # simulation que personne n'a nommée, et les formulaires pour étiqueter leurs listes
  # déroulantes.
  simulations:
    default_name: "%{type} à %{city}, %{surface} m²"
    property_types:
      apartment: Appartement
      house: Maison
      parking: Parking
      building: Immeuble
    rental_types:
      furnished: Meublé
      unfurnished: Nu
  views:
    nav:
      economic_conditions: Conditions économiques
      sign_out: Déconnexion
      sign_in: Connexion
      sign_up: Inscription
    account:
      show:
        title: Mon compte
        identity: Identité
        security: Sécurité
        new_password: Nouveau mot de passe
        password_hint: "%{count} caractères minimum"
        update_password: Changer mon mot de passe
    economic_conditions:
      edit:
        title: Conditions économiques
        subtitle: "Les hypothèses dont hérite chaque nouvelle simulation."
        save: Enregistrer les conditions
      fields:
        rent_growth_rate_hint: "Ce que le loyer gagne chaque année, indexation du bail comprise. La première année porte le loyer saisi ; la deuxième l'augmente d'autant."
        property_growth_rate_hint: "Ce que le bien prend en valeur chaque année. Le prix d'achat seul progresse : ni les frais de notaire ni les travaux ne se revendent."
        inflation_rate_hint: "Ce dont les charges annuelles s'alourdissent chaque année — taxe foncière, assurance, entretien et le reste."
    pages:
      home:
        title: Bienvenue sur Prunay
        subtitle: Estimez la rentabilité de votre investissement locatif
        cta: Commencer
    simulations:
      index:
        title: Mes simulations
        new: Nouvelle simulation
        empty: Aucune simulation enregistrée.
        name: Nom
        purchase_date: "Date d'acquisition"
        total_investment: Investissement initial
        annual_cash_flow: Cash-flow annuel
      form:
        cancel: Annuler
      # Les charges annuelles se demandent par groupe, et les mêmes groupes servent à
      # l'assistant comme au formulaire de modification : d'où leur place ici, hors des
      # étapes. Chaque intertitre dit ce qui engendre la dépense, et son commentaire ce que
      # le groupe recouvre — y compris les conditions qui font apparaître ou disparaître un
      # montant.
      charges:
        groups:
          ownership:
            title: La détention du bien
            hint: "Ce que le bien coûte, loué ou non. L'entretien est proposé au double quand aucune copropriété ne porte déjà la façade, la toiture et les communs."
          letting:
            title: "L'exploitation locative"
            hint: "Ce que l'on paie pour louer : rien par défaut, car ni une gestion déléguée ni une garantie des loyers impayés ne se supposent."
          furnished:
            title: Le régime meublé
            hint: "Ce que le meublé impose : la cotisation foncière des entreprises, et le bilan qu'un comptable établit. Un bien loué nu ne les paie pas."
          other:
            title: Divers
            hint: "Tout ce que les groupes précédents ne nomment pas."
      steps:
        title: Nouvelle simulation
        next: Continuer
        back: Retour
        cancel: Annuler
        create: Créer la simulation
        property:
          title: Le bien
          hint: "Ce que l'on achète et où il se trouve. Seules la ville et la surface sont indispensables — la surface sert ensuite à estimer les montants des pages suivantes."
          name_hint: "Facultatif : à défaut, la simulation prendra le nom de son bien — type, ville et surface."
          address_hint: Facultatif.
          energy_rating_blank: Non renseigné
        purchase:
          title: "L'achat"
          hint: "Ce que le bien immobilise le premier jour : le prix, les frais de notaire qu'il entraîne, et les travaux à engager avant la première location."
          notary_fees_hint: "Calculés d'après le prix — 7,42 % majorés de 1 772 € — et non saisis. Ils s'ajoutent au prix dans le capital immobilisé."
          initial_works_hint: "Les travaux engagés avant la première location. Ils s'ajoutent au prix dans le capital immobilisé."
          down_payment_hint: "Ce que vous sortez de votre poche à la signature. Proposé à %{share} du coût du projet — prix, frais de notaire et travaux —, l'ordre de grandeur qu'une banque attend. Le reste est emprunté."
          purchase_date_hint: "Proposée trois mois après aujourd'hui, le temps d'un compromis."
        credit:
          title: Le crédit
          hint: "À quelles conditions la banque prête le reste. La mensualité ne se saisit pas : elle se déduit du capital emprunté, du taux et de la durée. L'assurance emprunteur, elle, se saisit : la banque ne prête pas sans elle."
          borrowed_capital_hint: "Le coût du projet (%{total}) moins votre apport (%{down_payment})."
          loan_rate_hint: "Le taux annuel hors assurance emprunteur."
          loan_duration_hint: "En années, %{years} au plus — au-delà, la projection s'arrêterait avant la dernière échéance."
          loan_insurance_hint: "La prime prélevée chaque mois avec l'échéance, du premier prélèvement au solde. Proposée à %{rate} du capital emprunté (%{capital}) par mois, le taux d'un contrat de groupe — à corriger dès que l'offre de prêt en dit le vrai montant."
          monthly_payment_hint: "Mensualité à annuités constantes, hors assurance : M = C × i / (1 − (1 + i)^−n). L'assurance s'y ajoute pour faire l'échéance, et l'annuité — douze échéances — se retranche du cash-flow de chaque année de la projection, tant que le crédit court."
        rental:
          title: La location
          hint: "Ce que le bien rapporte une fois loué."
          monthly_rent_hint: "Le loyer perçu chaque mois, hors charges. Le montant proposé est estimé d'après la surface."
          occupancy_months_hint: "Le nombre de mois loués dans l'année : onze laissent un mois de vacance locative."
        charges:
          title: Les charges annuelles
          hint: "Ce que le bien coûte chaque année, groupe par groupe. Les montants proposés sont estimés d'après la surface, à corriger. Leur total se déduit des loyers chaque année de la projection."
      edit:
        title: Modifier la simulation
      show:
        subtitle: "Acquisition prévue le %{date}"
        edit: Modifier
        project_cost: Coût du projet
        initial_outlay: Investissement initial
        tab_parameters: Les paramètres du bien
        tab_projection: "Projection sur %{years} ans"
        tab_amortization: "Tableau d'amortissement"
        tab_economic_conditions: Conditions économiques
        property: Le bien
        purchase_detail: "L'achat"
        credit_detail: Le crédit
        rental_detail: La location
        annual_rent_total: "Loyers d'une année, vacance déduite"
        charges_detail: Les charges annuelles
        economic_conditions_detail: Les conditions économiques
        economic_conditions_hint: "Ce que cette simulation-là suppose du temps qui passe. Elle a hérité des conditions par défaut le jour de sa création ; les corriger ici ne change qu'elle, et la projection s'en trouve refaite."
        annual_charges_total: Total des charges annuelles
        surface_value: "%{surface} m²"
        occupancy_value: "%{months} mois par an"
        not_provided: Non renseigné
        answer_yes: Oui
        answer_no: Non
        projection: "Projection sur %{years} ans"
        duration_value: "%{years} ans (%{months} mois)"
        amortization_hint: "Une ligne par échéance : %{capital} empruntés à %{rate}, remboursés en %{months} mensualités de %{payment}, auxquelles s'ajoute %{insurance} d'assurance emprunteur — soit %{total_payment} prélevés chaque mois. La première échéance tombe un mois après la signature."
        payment_number: Échéance
        due_on: Date
        payment: Mensualité
        interest: Intérêts
        principal: Capital remboursé
        insurance: Assurance
        remaining_capital: Capital restant dû
        total_loan_cost: Coût total du crédit
        year: Année
        date: Date
        annual_rent_column: "Loyers de l'année"
        cash_flow: Cash-flow
        immobilized_capital: Capital immobilisé
        total_cash_flow: "Cash-flow cumulé sur %{years} ans"
        final_property_value: "Valeur du bien au bout de %{years} ans"
        back: Retour aux simulations
        delete: Supprimer
        confirm_delete: Êtes-vous sûr ?
  flash:
    economic_conditions:
      updated: Conditions économiques mises à jour.
    simulations:
      created: Simulation créée avec succès.
      updated: Simulation mise à jour avec succès.
      destroyed: Simulation supprimée avec succès.
    errors:
      not_found: La ressource demandée est introuvable.
  number:
    format:
      delimiter: " "
      separator: ","
    percentage:
      format:
        delimiter: " "
        separator: ","
        format: "%n %"
    currency:
      format:
        unit: "€"
        delimiter: " "
        separator: ","
        precision: 2
        format: "%n %u"
